1. Start with "Score: XX/100 — " followed by the verdict: ≥80 "Very good fit"; 70–79 "Good fit"; 60–69 "Partial but defensible fit"; <60 "Weak fit".
2. Line "STRENGTHS" (the single word, uppercase), then 2–3 one-line bullets, 12 words maximum each — the fact, then the proof (client).
3. Line "WATCH-OUTS", then 1–2 one-line bullets, 12 words maximum — the gap, without downplaying it.
4. Line "RECOMMENDATION", then one single blunt sentence (talk with Jérémy / talk while addressing X / pass).
Nothing else.

SPECIAL CASE — SCORE BETWEEN 25 AND 49
If your honest assessment lands between 25 and 49: write neither strengths, nor watch-outs, nor recommendation.
1. Keep the first line "Score: XX/100 — Weak fit".
2. Follow with 2 sentences maximum, in dry, understated British wit: understatement, composure, discreet self-deprecation; no exclamation marks, never mocking the visitor's need. Acknowledge it is the wrong casting, say in a word which profile would fit better, and leave the door ajar should the need ever drift toward strategy, innovation or AI.
Tone example (adapt it, do not copy): "You need a SAP expert; I facilitate transformations. I have no doubt the conversation would be excellent — your ERP, however, deserves someone else."

SUB-CASE — SCORE BELOW 25/100
If the score is strictly below 25: shorter still.
1. First line: "Score: XX/100 — Crossed wires" (emphatically not "Weak fit").
2. One or two sentences at most, written in the first person (Jérémy speaking — never "Jérémy" in the third person), without any emphatic "me, I" turn of phrase: a single deadpan, self-deprecating joke, never at the expense of the visitor's need or craft. The mechanic: first state, perfectly seriously and without qualification, that the idea of trusting me with this need is a very good one; then hint that depending on the day rate, it could be given some thought — as if only the fee stood between me and that career change. The joke alone: no explanatory sentence, no reminder of my actual job, no "you need X; I do Y" comparison. Adapt it to the precise context, in simple everyday words, no jargon. Understatement and composure, no exclamation marks, no advice, never any "Limited analysis" note.
Tone example (adapt to the context, do not copy word for word): "Trusting me with your bakery: a very good idea, truly. Depending on the day rate, it could be given some thought."

HONESTY REQUIREMENTS
- Differentiated scores: no artificial clustering between 60 and 75; a poor fit must be stated clearly.
- Systematically check these recurring gaps when relevant: business-school background (Audencia) vs engineering profiles; about 10 years of experience vs thresholds requiring 12–15+ years; no banking/PE-grade financial modelling; no documented permanent team management; no deep technical operations background (PLM, HPC, IT architecture).
- Every statement must be traceable to the profile or the posting; no generic sentences.
- If the input is a single sentence (not a full posting) AND the score is 25 or above: end with "Limited analysis — based on the title alone" + one line listing the missing information that would change the score. Below 25, this note is forbidden.

ELEMENT TO ANALYSE:
"""${need}"""`,
  },
};

/* V6 (U5) : langue partagée avec l'accueil — clé localStorage 'langue' ('fr'/'en', repli 'fr').
   Lue AVANT le premier rendu pour que P/T (et le squelette remplacé) partent dans la bonne langue. */
let LANG0 = 'fr';
try { if (localStorage.getItem('langue') === 'en') LANG0 = 'en'; } catch (e) { /* stockage indisponible : repli fr */ }
let P = LANG0 === 'en' && window.PROFILE_EN ? window.PROFILE_EN : window.PROFILE;
let T = TXT[LANG0] || TXT.fr;
if (LANG0 !== 'fr') document.documentElement.lang = LANG0;

/* ---------- animation helpers ---------- */
function Reveal({ children, style }) {
  /* Plus d'apparition au scroll : toute la page est visible d'un coup (elle arrive avec le fondu de page global). */
  return <div style={style}>{children}</div>;
}

function Count({ to, suffix }) {
  /* Valeur finale directe — plus de comptage progressif. */
  return <span>{to}{suffix}</span>;
}

function Progress() {
  const [w, setW] = useState(0);
  useEffect(() => {
    const f = () => {
      const h = document.documentElement;
      setW((h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight)) * 100);
    };
    window.addEventListener('scroll', f, { passive: true });
    f();
    return () => window.removeEventListener('scroll', f);
  }, []);
  return <div style={{ position: 'fixed', top: 0, left: 0, height: 2, width: w + '%', background: '#33618f', zIndex: 60 }} />;
}

function AccentLine() {
  /* Deja trace, sans animation d'apparition. */
  return <div className="accent-line in" style={{ margin: '0 0 16px' }} />;
}

/* ---------- navigation clavier verticale (même système que la galerie en horizontal) :
   ↑/↓ et les chevrons ⌃/⌄ sautent de section en section ; aux extrémités → accueil ---------- */
const NAV_IDS = ['hero', 'postures', 'parcours', 'missions'];
function navReduce() {
  try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
}
function navCurrent() {
  const y = window.scrollY + window.innerHeight * 0.35; /* section occupant le tiers haut du viewport */
  let idx = 0;
  for (let k = 0; k < NAV_IDS.length; k++) {
    const el = document.getElementById(NAV_IDS[k]);
    if (el && el.offsetTop <= y) idx = k;
  }
  return idx;
}
function navGoTo(i) {
  i = Math.max(0, Math.min(NAV_IDS.length - 1, i));
  const el = document.getElementById(NAV_IDS[i]);
  if (el) el.scrollIntoView({ behavior: navReduce() ? 'auto' : 'smooth', block: 'start' });
}
function navRetour() { const r = document.getElementById('retour-tab'); if (r) r.click(); } /* fondu de page vers l'accueil */
function navStep(dir) { /* dir -1 = ↑ (section préc.) ; +1 = ↓ (section suiv.) ; aux bords → accueil */
  const c = navCurrent();
  if (dir === -1 && c === 0) { navRetour(); return; }
  if (dir === 1 && c === NAV_IDS.length - 1) { navRetour(); return; }
  navGoTo(c + dir);
}
function KeyNav() {
  const [active, setActive] = useState(0);
  useEffect(() => {
    const onScroll = () => setActive(navCurrent());
    const onKey = (e) => {
      const t = e.target, tag = (t && t.tagName || '').toUpperCase();
      if (tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable)) return; /* champ focalisé : flèches = édition */
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); navStep(-1); }
      else if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); navStep(1); }
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('keydown', onKey);
    onScroll();
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('keydown', onKey); };
  }, []);
  const labels = [T.navHero, T.postTitle, T.tlTitle, T.misTitle];
  const last = NAV_IDS.length - 1;
  return (
    <>
      <button className="prof-chev prof-chev-up" type="button"
        aria-label={active === 0 ? T.navHome : T.navUp} onClick={() => navStep(-1)}><span className="gly">›</span></button>
      {active === 0 && <span className="prof-chev-lbl prof-chev-lbl-up">{T.navHome}</span>}
      <button className="prof-chev prof-chev-down" type="button"
        aria-label={active === last ? T.navHome : T.navDown} onClick={() => navStep(1)}><span className="gly">›</span></button>
      {active === last && <span className="prof-chev-lbl prof-chev-lbl-down">{T.navHome}</span>}
      <nav className="sec-rail" aria-label={T.navAria}>
        {NAV_IDS.map((id, i) => (
          <button key={id} type="button" className={i === active ? 'on' : undefined}
            aria-label={labels[i]} aria-current={i === active ? 'true' : undefined}
            onClick={() => navGoTo(i)} />
        ))}
      </nav>
    </>
  );
}

/* ---------- atoms ---------- */
function Section({ id, kicker, title, children, alt }) {
  return (
    <section id={id} style={{ ...S.section, ...(alt ? S.sectionAlt : {}) }}>
      <div style={S.inner}>
        <Reveal>
          {kicker && <div style={S.kicker}>{kicker}</div>}
          {(kicker || title) && <AccentLine />}
          {title && <h2 style={S.h2}>{title}</h2>}
        </Reveal>
        {children}
      </div>
    </section>
  );
}

/* ---------- Hero ---------- */
function Hero() {
  const stats = [
    { n: P.identite.experience, s: '+' },
    { n: P.missions.length, s: '' },
    { n: P.secteurs.length, s: '' },
    { n: P.postures.length, s: '' },
  ];
  return (
    <header id="hero" className="hero-wrap" style={S.hero}>
      <div style={S.heroGrid}>
        <div style={S.heroText}>
          <h1 className="rise" style={{ ...S.heroTitle, animationDelay: '.14s' }}>{P.identite.titre}</h1>
          <p className="rise" style={{ ...S.heroPitch, animationDelay: '.26s' }}>{T.heroPitch}</p>
        </div>
        {window.PHOTO && (
          <div className="rise" style={{ ...S.heroPhotoWrap, animationDelay: '.46s' }}>
            <img src={window.PHOTO} alt="Jérémy Hamon" style={S.heroPhoto} />
          </div>
        )}
      </div>
      <div className="rise" style={{ ...S.statsRow, animationDelay: '.56s' }}>
        {stats.map((st, i) => (
          <div key={i} style={S.statItem}>
            <div style={S.statNum}><Count to={st.n} suffix={st.s} /></div>
            <div style={S.statLabel}>{T.statLabels[i]}</div>
          </div>
        ))}

}

/* ---------- Postures ---------- */
function Postures() {
  const [i, setI] = useState(0);
  const [pin, setPin] = useState(false);
  useEffect(() => {
    if (pin) return;
    const t = setInterval(() => setI((v) => (v + 1) % P.postures.length), 3200);
    return () => clearInterval(t);
  }, [pin]);
  const p = P.postures[i];
  return (
    <Section id="postures" kicker={T.postKicker} title={T.postTitle} alt>
      <p style={S.sectionIntro}>{T.postIntro}</p>
      <div style={S.postPills}>
        {P.postures.map((x, j) => (
          <button key={j} className="btn pill-anim" onClick={() => { setI(j); setPin(true); }}
            style={{ ...S.postPill, ...(j === i ? S.postPillOn : {}) }}>
            <span style={S.postNum}>{String(j + 1).padStart(2, '0')}</span> {x.nom}
          </button>
        ))}
      </div>
      <div key={i} className="fadeq" style={S.postDesc}>{p.desc}</div>
    </Section>
  );
}

/* ---------- Timeline ---------- */
function TLDesc({ text }) {
  const [open, setOpen] = useState(false);
  return (
    <div className={open ? '' : 'clamp2'} onClick={() => setOpen((o) => !o)}
      style={{ ...S.tlDesc, cursor: 'pointer' }} title={open ? T.collapse : T.readMore}>
      {text}
    </div>
  );
}
function Timeline() {
  return (
    <Section id="parcours" kicker={T.tlKicker} title={T.tlTitle}>
      <div>
        {P.timeline.map((t, i) => (
          <Reveal key={i} delay={i * 40}>
            <div style={S.tlRow}>
              <div style={S.tlYear}>{t.annee}</div>
              <div style={S.tlLine}><div style={{ ...S.tlDot, ...(t.type !== 'exp' ? S.tlDotForm : {}) }} /></div>
              <div style={S.tlCard}>
                <div style={S.tlHead}>
                  <span style={S.tlTitre}>{t.titre}</span>
                  {t.lieu && <span style={S.tlLieu}>{t.lieu}</span>}
                </div>
                <div style={S.tlRole}>{t.role}</div>
                <TLDesc text={t.desc} />
              </div>
            </div>
          </Reveal>
        ))}
      </div>
    </Section>
  );
}

/* ---------- Missions ---------- */
function Missions() {
  const [dim, setDim] = useState('domaine');
  const [filtre, setFiltre] = useState(T.all);
  const [all, setAll] = useState(false);
  const valeurs = useMemo(
    () => [T.all, ...Array.from(new Set(P.missions.map((m) => m[dim])))],
    [dim]
  );
  const list = P.missions.filter((m) => filtre === T.all || m[dim] === filtre);
  const shown = all ? list : list.slice(0, 7);
  return (
    <Section id="missions" kicker={T.misKicker} title={T.misTitle} alt>
      <div style={S.dimRow}>
        {T.dims.map((d) => (
          <button key={d.key} className="btn" onClick={() => { setDim(d.key); setFiltre(T.all); setAll(false); }}
            style={{ ...S.dimBtn, ...(dim === d.key ? S.dimBtnOn : {}) }}>{d.label}</button>
        ))}
      </div>
      <div style={S.filterRow}>
        {valeurs.map((v) => (
          <button key={v} className="btn" onClick={() => { setFiltre(v); setAll(false); }}
            style={{ ...S.filterBtn, ...(filtre === v ? S.filterBtnOn : {}) }}>{v}</button>
        ))}
      </div>
      <div>
        {shown.map((m, i) => (
          <Reveal key={m.titre} delay={Math.min(i, 6) * 30}>
            <div className="misrow" style={S.misRow}>
              <span style={S.misDom}>{m[dim === 'secteur' ? 'secteur' : 'domaine']}</span>
              <span>
                <div style={S.misTitre}>{m.titre}</div>
                <div style={S.misMeta}>{m.client} · {m.duree}</div>
              </span>
            </div>
          </Reveal>
        ))}
      </div>
      {list.length > 7 && (
        <div style={{ marginTop: 22 }}>
          <button className="btn" style={S.ctaGhost} onClick={() => setAll((a) => !a)}>
            {all ? T.collapse : T.seeAll(list.length)}
          </button>
        </div>
      )}
    </Section>
  );
}

  resMis: { padding: '9px 0', borderBottom: '1px solid #e4e9ef' },
  resMisTitre: { fontWeight: 600, fontSize: 13.5, lineHeight: 1.35 },
  resCta: { marginTop: 22 },
  /* contact */
};


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
} catch (e) {
  document.getElementById('root').innerHTML =
    '<pre style="color:#b3261e;padding:24px;white-space:pre-wrap;font-size:13px">' +
    (e && e.stack ? e.stack : e) + '</pre>';
  console.error('Render error:', e);
}
  </script>
  <!-- #transition-page : fondu de page en JS (cross-navigateur, remplace les View Transitions natives) -->
  <script>
  (function () {
    var IN = 550, OUT = 350, b = document.body;               /* durees fondu entrant / sortant (ms) */
    function fadeIn() { b.style.transition = 'opacity ' + IN + 'ms ease'; b.style.opacity = '1'; }
    requestAnimationFrame(function () { requestAnimationFrame(fadeIn); });
    setTimeout(fadeIn, IN + 600);                             /* securite anti page blanche */
    addEventListener('pageshow', function (e) { if (e.persisted) { b.style.transition = 'none'; b.style.opacity = '1'; } });
    document.addEventListener('click', function (e) {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target.closest ? e.target.closest('a[href]') : null;
      if (!a || a.target === '_blank' || a.hasAttribute('download')) return;
      var url; try { url = new URL(a.getAttribute('href'), location.href); } catch (_) { return; }
      if (url.origin !== location.origin || url.pathname === location.pathname) return; /* externe ou meme document : navigation normale */
      e.preventDefault();
      b.style.transition = 'opacity ' + OUT + 'ms ease'; b.style.opacity = '0';
      setTimeout(function () { location.href = a.href; }, OUT);
    }, true);
  })();
  </script>
